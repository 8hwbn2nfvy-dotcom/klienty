<h1>Настройки</h1>
<section class="block">
  <h2>Оформление</h2>
  <div class="themes" id="theme" role="group" aria-label="Оформление">
    <button type="button" class="theme-tile" data-theme="light"><span class="swatch sw-light"></span>Белый</button>
    <button type="button" class="theme-tile" data-theme="dark"><span class="swatch sw-dark"></span>Чёрный</button>
    <button type="button" class="theme-tile" data-theme="graphite"><span class="swatch sw-graphite"></span>Графит</button>
    <button type="button" class="theme-tile" data-theme="sand"><span class="swatch sw-sand"></span>Песочный</button>
    <button type="button" class="theme-tile" data-theme="navy"><span class="swatch sw-navy"></span>Ночной синий</button>
  </div>
</section>
<section class="block">
  <h2>Выход</h2>
  <button class="btn" id="logout" type="button">Выйти</button>
</section>
<p class="muted small" id="about"></p>
